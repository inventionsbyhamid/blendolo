# Demo catalogue: made-up products that show how ease tags work. Not real products, not for sale.
# step: the step in steps.yml this product is for. format: what it is. closure: how it opens
# (pump, flip_cap, magnetic, pull_cap, twist_cap, clasp_compact, none). grip: how it holds (chunky, big_handle,
# standard, slim). Tags come from these (see ProductEase#tags).

